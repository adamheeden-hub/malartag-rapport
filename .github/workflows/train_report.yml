
name: Malartag rapport

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
      timezone: "Europe/Stockholm"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Hamta projekt
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hamta taginformation
        env:
          TRAFIKVERKET_API_KEY: ${{ secrets.TRAFIKVERKET_API_KEY }}
        run: python train_report.py

      - name: Forbered rapport
        run: |
          mkdir -p public
          cp report.json public/report.json
          echo "Malartag rapport" > public/index.html

      - name: Konfigurera Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp rapport
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: report
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicera rapport
        id: deployment
        uses: actions/deploy-pages@v4
